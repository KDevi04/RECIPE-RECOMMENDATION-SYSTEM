<!DOCTYPE html>  
<html lang="en">  
<head>  
<title> Bootstrap Navbar Example </title>  
<meta charset = "utf-8">  
<meta name = "viewport" content = "width=device-width, initial-scale=1">  
<link href = "https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel = "stylesheet">  
<script src = "https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>  
</head>  

<body>  
    <nav class="navbar navbar-expand-lg navbar-light bg-dark">
        <div class="container-fluid" >
          <a class="navbar-brand" href="#" cellpadding="10px">home</a>
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
              <li class="nav-item">
                <a class="nav-link active" aria-current="page" href="#" cellpadding="10px">Diet recipes</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="#" cellpadding="10px">Ingredient recipes</a>
              </li>
              <li class="nav-item">
                <a class="nav-link disabled" href="#" tabindex="-1" aria-disabled="true">About Us</a>
              </li>
            </ul>
            <form class="d-flex">
              <input class="form-control me-2" type="search" placeholder="search" aria-label="search">
              <button class="btn btn-outline-success" type="submit" border cellpadding="10px">sign up</button>
            </form>
          </div>
        </div>
      </nav>  
</body>  
</html>
